const Scanner={
  stream:null,active:false,detector:null,zxingReader:null,currentDevice:'environment',
  lastResult:null,lastResultTime:0,onDetect:null,
  formats:['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','data_matrix','aztec','pdf417'],
  async isNativeSupported(){
    if(!('BarcodeDetector' in window))return false;
    try{const s=await BarcodeDetector.getSupportedFormats();return this.formats.some(f=>s.includes(f))}catch{return false}
  },
  async start(videoEl,onDetect){
    this.onDetect=onDetect;this.active=true;
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:this.currentDevice},width:{ideal:1280},height:{ideal:720}},audio:false});
      videoEl.srcObject=this.stream;
      videoEl.setAttribute('playsinline','true');videoEl.setAttribute('autoplay','true');videoEl.setAttribute('muted','true');
      await videoEl.play();
      if(await this.isNativeSupported())await this.startNative(videoEl);
      else await this.startZXing(videoEl);
    }catch(err){
      this.stop();
      throw new Error(err.name==='NotAllowedError'?'Permiso de cámara denegado':err.name==='NotFoundError'?'No se encontró cámara':'Error: '+err.message);
    }
  },
  async startNative(videoEl){
    this.detector=new BarcodeDetector({formats:this.formats});
    const loop=async()=>{
      if(!this.active)return;
      try{const codes=await this.detector.detect(videoEl);if(codes.length>0)this.handleDetection(codes[0].rawValue,codes[0].format)}catch{}
      if(this.active)requestAnimationFrame(loop);
    };loop();
  },
  async startZXing(videoEl){
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.AZTEC,ZXing.BarcodeFormat.PDF_417]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const reader=new ZXing.BrowserMultiFormatReader(hints,{delayBetweenScanAttempts:100,delayBetweenScanSuccess:500});
    this.zxingReader=reader;
    const devices=await navigator.mediaDevices.enumerateDevices();
    const cams=devices.filter(d=>d.kind==='videoinput');
    let deviceId=cams[0]?.deviceId;
    if(this.currentDevice==='user'){const f=cams.find(d=>/front|user/i.test(d.label));if(f)deviceId=f.deviceId}
    else{const f=cams.find(d=>/back|rear|environment/i.test(d.label));if(f)deviceId=f.deviceId}
    if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}
    videoEl.srcObject=null;
    reader.decodeFromVideoDevice(deviceId,videoEl,(result)=>{if(result)this.handleDetection(result.getText(),'zxing')});
  },
  handleDetection(text,format){
    if(!text)return;const now=Date.now();
    if(text===this.lastResult&&now-this.lastResultTime<2000)return;
    this.lastResult=text;this.lastResultTime=now;this.feedback();this.onDetect?.(text,format);
  },
  feedback(){
    if(navigator.vibrate)navigator.vibrate(80);
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      const osc=ctx.createOscillator();const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=1200;osc.type='sine';
      gain.gain.setValueAtTime(0.15,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
      osc.start();osc.stop(ctx.currentTime+0.15);
    }catch{}
  },
  async toggleCamera(videoEl){
    this.currentDevice=this.currentDevice==='environment'?'user':'environment';
    this.stop();this.active=true;await this.start(videoEl,this.onDetect);
  },
  stop(){
    this.active=false;
    if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}
    if(this.zxingReader){try{this.zxingReader.reset()}catch{}this.zxingReader=null}
    this.detector=null;
  }
};

// IMPRESIÓN TÉRMICA
// ═══════════════════════════════════════════════════════════════════
const ThermalPrinter={
  device:null,characteristic:null,connected:false,width:58,charsPerLine:32,
  isSupported(){return 'bluetooth' in navigator},
  profiles:[
    {name:'Genérica1',service:0xFFE0,characteristic:0xFFE1},
    {name:'Genérica2',service:0xFF00,characteristic:0xFF02},
    {name:'GOOJPRT/Xprinter',service:0x18F0,characteristic:0x2AF1},
    {name:'ISSC/HM-10',service:'49535343-fe7d-4ae5-8fa9-9fafd205e455',characteristic:'49535343-8841-43f4-a8d4-ecbe34729bb3'}
  ],
  async connect(){
    if(!this.isSupported())throw new Error('Web Bluetooth no soportado. Usa Chrome Android.');
    this.device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xFFE0,0xFF00,0x18F0]});
    const server=await this.device.gatt.connect();
    for(const p of this.profiles){
      try{
        const svcU=typeof p.service==='number'?p.service.toString(16).padStart(4,'0')+'-0000-1000-8000-00805f9b34fb':p.service;
        const chU=typeof p.characteristic==='number'?p.characteristic.toString(16).padStart(4,'0')+'-0000-1000-8000-00805f9b34fb':p.characteristic;
        const service=await server.getPrimaryService(svcU);
        this.characteristic=await service.getCharacteristic(chU);
        this.connected=true;
        return p.name;
      }catch{continue}
    }
    throw new Error('Perfil no encontrado');
  },
  disconnect(){if(this.device&&this.device.gatt.connected)this.device.gatt.disconnect();this.device=null;this.characteristic=null;this.connected=false},
  async sendBytes(bytes){
    if(!this.characteristic)throw new Error('Impresora no conectada');
    const CHUNK=100;
    for(let i=0;i<bytes.length;i+=CHUNK){
      await this.characteristic.writeValue(bytes.slice(i,i+CHUNK));
      await new Promise(r=>setTimeout(r,20));
    }
  },
  esc:{
    init:[0x1B,0x40],alignLeft:[0x1B,0x61,0x00],alignCenter:[0x1B,0x61,0x01],
    boldOn:[0x1B,0x45,0x01],boldOff:[0x1B,0x45,0x00],
    doubleOn:[0x1D,0x21,0x11],doubleOff:[0x1D,0x21,0x00],
    feed:[0x0A],cut:[0x1D,0x56,0x42,0x00]
  },
  textToBytes(str){const out=[];for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);out.push(c<=255?c:0x3F)}return out},
  line(l,r=''){const w=this.charsPerLine;if(!r)return l.slice(0,w)+'\n';const sp=w-l.length-r.length;return(sp<=0?(l.slice(0,w-r.length-1)+' '+r):(l+' '.repeat(sp)+r)).slice(0,w)+'\n'},
  hr(){return '-'.repeat(this.charsPerLine)+'\n'},
  async printInvoice(invoice,opts={}){
    if(!this.connected){const prof=await this.connect();toast(`✅ Conectado: ${prof}`,'success')}
    const w=opts.width||this.width;this.charsPerLine=w===80?48:32;
    const e=this.esc;const bytes=[];
    bytes.push(...e.init,...e.alignCenter,...e.doubleOn,...this.textToBytes(state.company.name),...e.feed,...e.doubleOff);
    bytes.push(...this.textToBytes(`RIF: ${state.company.rif}`),...e.feed);
    if(state.company.address)bytes.push(...this.textToBytes(state.company.address),...e.feed);
    if(state.company.phone)bytes.push(...this.textToBytes(`Tel: ${state.company.phone}`),...e.feed);
    bytes.push(...e.alignLeft,...this.textToBytes(this.hr()));
    bytes.push(...this.textToBytes(this.line(`Factura: ${invoice.number}`)));
    bytes.push(...this.textToBytes(this.line(`Fecha: ${new Date(invoice.issuedAt).toLocaleString('es-VE')}`)));
    if(invoice.customerSnapshot){
      bytes.push(...this.textToBytes(this.hr()),...e.boldOn,...this.textToBytes('CLIENTE'),...e.boldOff,...e.feed);
      bytes.push(...this.textToBytes(invoice.customerSnapshot.name),...e.feed);
      bytes.push(...this.textToBytes(invoice.customerSnapshot.docId),...e.feed);
      if(invoice.customerSnapshot.phone)bytes.push(...this.textToBytes(invoice.customerSnapshot.phone),...e.feed);
    }
    bytes.push(...this.textToBytes(this.hr()),...e.boldOn,...this.textToBytes('PRODUCTOS'),...e.boldOff,...e.feed);
    for(const it of invoice.items){
      const l1=it.name.length>this.charsPerLine-4?it.name.slice(0,this.charsPerLine-4)+'...':it.name;
      bytes.push(...this.textToBytes(l1),...e.feed);
      bytes.push(...this.textToBytes(this.line(`  ${it.qty} x ${fmtUSD(it.priceUSD)}`,fmtUSD(it.qty*it.priceUSD))));
    }
    bytes.push(...this.textToBytes(this.hr()));
    bytes.push(...this.textToBytes(this.line('Subtotal:',fmtUSD(invoice.subtotalUSD))));
    bytes.push(...this.textToBytes(this.line('IVA:',fmtUSD(invoice.taxUSD))));
    bytes.push(...e.boldOn,...e.doubleOn,...this.textToBytes(this.line('TOTAL USD:',fmtUSD(invoice.totalUSD))),...e.doubleOff,...e.boldOff,...e.feed);
    bytes.push(...this.textToBytes(this.line('Tasa:',invoice.bcvRate.toFixed(2))));
    bytes.push(...this.textToBytes(this.line('TOTAL Bs:',fmtVES(invoice.totalVES))));
    bytes.push(...this.textToBytes(this.hr()),...e.alignCenter,...this.textToBytes('¡Gracias por su compra!'),...e.feed);
    if(invoice.hashSignature)bytes.push(...this.textToBytes(invoice.hashSignature.slice(0,16)),...e.feed);
    bytes.push(...this.textToBytes(new Date().toLocaleString('es-VE')));
    bytes.push(...e.feed,...e.feed,...e.feed,...e.cut);
    await this.sendBytes(new Uint8Array(bytes));
    toast('✅ Ticket impreso','success');
  }
};

function renderTicketHTML(inv,width){
  const chars=width===80?48:32;
  const line=(l,r='')=>{
    if(!r)return `<div>${esc(l)}</div>`;
    const sp=Math.max(1,chars-l.length-r.length);
    return `<div style="display:flex;justify-content:space-between"><span>${esc(l)}</span><span>${'&nbsp;'.repeat(sp)}${esc(r)}</span></div>`;
  };
  const hr='<div style="border-top:1px dashed #000;margin:4px 0"></div>';
  return `<div class="ticket-preview" style="font-size:${width===80?12:11}px;max-width:${width}mm">
    <div style="text-align:center;font-weight:bold;font-size:${width===80?15:13}px">${esc(state.company.name)}</div>
    <div style="text-align:center">RIF: ${esc(state.company.rif)}</div>
    ${state.company.address?`<div style="text-align:center">${esc(state.company.address)}</div>`:''}
    ${state.company.phone?`<div style="text-align:center">Tel: ${esc(state.company.phone)}</div>`:''}
    ${hr}
    ${line(`Factura: ${inv.number}`)}
    ${line(`Fecha: ${new Date(inv.issuedAt).toLocaleString('es-VE')}`)}
    ${inv.customerSnapshot?`${hr}<div style="font-weight:bold">CLIENTE</div><div>${esc(inv.customerSnapshot.name)}</div><div>${esc(inv.customerSnapshot.docId)}</div>${inv.customerSnapshot.phone?`<div>${esc(inv.customerSnapshot.phone)}</div>`:''}`:''}
    ${hr}
    <div style="font-weight:bold">PRODUCTOS</div>
    ${inv.items.map(it=>`<div style="word-break:break-word">${esc(it.name)}</div>${line(`  ${it.qty} x ${fmtUSD(it.priceUSD)}`,fmtUSD(it.qty*it.priceUSD))}`).join('')}
    ${hr}
    ${line('Subtotal:',fmtUSD(inv.subtotalUSD))}
    ${line('IVA:',fmtUSD(inv.taxUSD))}
    <div style="font-weight:bold;font-size:${width===80?15:13}px">${line('TOTAL USD:',fmtUSD(inv.totalUSD))}</div>
    ${line(`Tasa ${esc(inv.rateLabel||'BCV')}:`,inv.bcvRate.toFixed(2))}
    <div style="font-weight:bold">${line('TOTAL Bs:',fmtVES(inv.totalVES))}</div>
    ${hr}
    <div style="text-align:center">¡Gracias por su compra!</div>
    ${inv.hashSignature?`<div style="text-align:center;font-size:9px">Firma: ${esc(inv.hashSignature.slice(0,20))}</div>`:''}
    <div style="text-align:center;font-size:9px;margin-top:4px">${new Date().toLocaleString('es-VE')}</div>
  </div>`;
}

function openTicketPreview(invoiceId){
  const inv=findInv(invoiceId);if(!inv)return;
  openModal(`<div class="p-4 space-y-3">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-bold">🖨️ Imprimir ticket</h2>
      <button type="button" data-close class="p-2 -mr-2 text-gray-400">✕</button>
    </div>
    <div class="flex gap-2 justify-center">
      <button data-ticket-size="58" class="ticket-size-btn px-3 py-1.5 rounded-full text-xs font-medium bg-primary text-white">58mm</button>
      <button data-ticket-size="80" class="ticket-size-btn px-3 py-1.5 rounded-full text-xs font-medium border">80mm</button>
    </div>
    <div id="ticketPreview" class="border-2 border-dashed border-gray-300 rounded-lg p-3 bg-white overflow-x-auto max-h-[60vh] overflow-y-auto">${renderTicketHTML(inv,58)}</div>
    <div class="grid grid-cols-2 gap-2">
      <button id="ticketSystem" class="btn bg-gray-900 text-white font-medium py-2.5 rounded-lg text-sm">🖨️ Sistema</button>
      <button id="ticketBT" class="btn bg-blue-600 text-white font-medium py-2.5 rounded-lg text-sm">📡 Bluetooth</button>
    </div>
    ${!ThermalPrinter.isSupported()?'<p class="text-xs text-amber-600 text-center bg-amber-50 rounded p-2">⚠️ Bluetooth solo en Chrome Android</p>':''}
  </div>`,{w:'max-w-md'});
  $$('.ticket-size-btn').forEach(b=>b.addEventListener('click',()=>{
    $$('.ticket-size-btn').forEach(x=>{x.classList.remove('bg-primary','text-white');x.classList.add('border')});
    b.classList.add('bg-primary','text-white');b.classList.remove('border');
    $('#ticketPreview').innerHTML=renderTicketHTML(inv,+b.dataset.ticketSize);
  }));
  $('#ticketSystem')?.addEventListener('click',()=>{
    const size=+($('.ticket-size-btn.bg-primary')?.dataset.ticketSize||58);
    const container=$('#thermalPrintContainer');
    container.innerHTML=renderTicketHTML(inv,size);
    window.print();
    setTimeout(()=>{container.innerHTML=''},1000);
  });
  $('#ticketBT')?.addEventListener('click',async()=>{
    try{
      const size=+($('.ticket-size-btn.bg-primary')?.dataset.ticketSize||58);
      ThermalPrinter.width=size;
      toast('🔍 Buscando impresoras...','info');
      await ThermalPrinter.printInvoice(inv,{width:size});
    }catch(err){toast('❌ '+err.message,'error');console.error(err)}
  });
}

function createDepartment(name){
  const trimmed=String(name||'').trim();
  if(!trimmed)return {error:'Ingresa el nombre'};
  if(trimmed.length<2)return {error:'Mínimo 2 caracteres'};
  if(trimmed.length>50)return {error:'Máximo 50 caracteres'};
  const existing=state.departments.find(d=>d.name.toLowerCase()===trimmed.toLowerCase());
  if(existing)return {existing};
  const palette=['#3B82F6','#06B6D4','#F59E0B','#EC4899','#10B981','#8B5CF6','#EF4444','#64748B','#F97316','#14B8A6','#A855F7','#EAB308'];
  const used=state.departments.map(d=>d.color);
  const free=palette.filter(c=>!used.includes(c));
  const color=free[0]||palette[state.departments.length%palette.length];
  const newDept={id:uid(),name:trimmed,color};
  state.departments.push(newDept);
  audit('CREATE','Department',newDept.id,{name:trimmed,color});
  return {created:newDept};
}

async function fetchAllRates(){
  try{
    const r=await fetch('https://ve.dolarapi.com/v1/tasas',{headers:{'Accept':'application/json'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    return Array.isArray(data)?data:null;
  }catch(e){console.warn('fetchAllRates fail:',e.message);return null}
}

async function refreshAllRates(showMsg=true){
  let rates=await fetchAllRates();
  if(!rates){
    const endpoints=[
      {key:'usd_oficial',url:'https://ve.dolarapi.com/v1/dolares/oficial'},
      {key:'usd_paralelo',url:'https://ve.dolarapi.com/v1/dolares/paralelo'},
      {key:'eur_oficial',url:'https://ve.dolarapi.com/v1/euros/oficial'},
      {key:'eur_paralelo',url:'https://ve.dolarapi.com/v1/euros/paralelo'}
    ];
    rates=[];
    for(const ep of endpoints){
      try{
        const r=await fetch(ep.url,{headers:{'Accept':'application/json'}});
        if(!r.ok)continue;
        const d=await r.json();
        if(d.promedio)rates.push({fuente:ep.key,nombre:ep.key,promedio:d.promedio,fechaActualizacion:d.fechaActualizacion||new Date().toISOString()});
      }catch{}
    }
  }
  if(!rates||!rates.length){if(showMsg)toast('⚠️ No se pudieron consultar tasas','warning');return false}
  const normalize=(src,label,key)=>({rate:parseFloat(src),label,symbol:key.includes('eur')?'EUR':'USD',source:'API',fetchedAt:new Date().toISOString()});
  const map={usd_oficial:null,usd_paralelo:null,eur_oficial:null,eur_paralelo:null};
  for(const r of rates){
    const n=(r.nombre||r.fuente||'').toLowerCase();
    const val=parseFloat(r.promedio);
    if(!val||val<=0)continue;
    if(n.includes('eur')&&n.includes('oficial'))map.eur_oficial=normalize(val,'EUR Oficial (BCV)','eur_oficial');
    else if(n.includes('eur')&&n.includes('paralelo'))map.eur_paralelo=normalize(val,'EUR Paralelo','eur_paralelo');
    else if(n.includes('usd')&&n.includes('oficial'))map.usd_oficial=normalize(val,'USD Oficial (BCV)','usd_oficial');
    else if(n.includes('usd')&&n.includes('paralelo'))map.usd_paralelo=normalize(val,'USD Paralelo','usd_paralelo');
    else if(n.includes('oficial')&&!n.includes('eur'))map.usd_oficial=normalize(val,'USD Oficial (BCV)','usd_oficial');
    else if(n.includes('paralelo')&&!n.includes('eur'))map.usd_paralelo=normalize(val,'USD Paralelo','usd_paralelo');
  }
  for(const [key,val] of Object.entries(map)){if(val)state.exchangeRates[key]=val}
  syncActiveRate();save();
  if(showMsg){const a=state.exchangeRates[state.activeRateType];toast(`✅ ${a.label}: ${a.rate.toFixed(2)}`,'success')}
  return true;
}

function syncActiveRate(){
  const active=state.exchangeRates[state.activeRateType];
  if(active&&active.rate>0){state.bcvRate=active.rate;state.bcvUpdatedAt=active.fetchedAt;state.bcvSource=active.source}
}

function setActiveRate(type){
  if(!state.exchangeRates[type])return;
  state.activeRateType=type;syncActiveRate();save();
  toast(`💵 Tasa: ${state.exchangeRates[type].label}`,'success');render();
}

function compressImage(file,max=400){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        const s=Math.min(max/img.width,max/img.height,1);
        c.width=img.width*s;c.height=img.height*s;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.7));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

const SIGN={PURCHASE:1,RETURN_IN:1,ADJUST_IN:1,INITIAL:1,SALE:-1,RETURN_OUT:-1,ADJUST_OUT:-1};
function registerMovement(productId,type,qty,opts={}){
  const p=findP(productId);if(!p)return null;
  const signed=SIGN[type]*qty;
  const newStock=p.stock+signed;
  if(newStock<0)throw new Error(`Stock insuficiente: ${p.name} (disponible ${p.stock})`);
  p.stock=newStock;
  if(type==='SALE')p.salesCount=(p.salesCount||0)+qty;
  const mv={id:uid(),productId,type,quantity:qty,signedQuantity:signed,balanceAfter:newStock,reason:opts.reason||'',reference:opts.reference||'',refType:opts.refType||'',refId:opts.refId||'',userId:state.currentUser.id,createdAt:new Date().toISOString()};
  state.movements.unshift(mv);
  return mv;
}
function addLedger(account,debit,credit,refType,refId,description){
  state.ledger.push({id:uid(),date:new Date().toISOString(),account,debitUSD:debit||0,creditUSD:credit||0,refType,refId,description});
}
function audit(action,entity,entityId,data){
  state.audit.unshift({id:uid(),userId:state.currentUser?.id||null,action,entity,entityId,data:data?JSON.stringify(data).slice(0,500):null,createdAt:new Date().toISOString()});
  if(state.audit.length>500)state.audit=state.audit.slice(0,500);
}

function viewDashboard(){

  const totalRev=invoices.reduce((a,i)=>a+i.totalUSD,0);
  const lowStock=state.products.filter(p=>p.stock<=p.minStock).sort((a,b)=>a.stock-b.stock);
  const customerDebt=state.customers.reduce((a,c)=>a+c.balance,0);
  const salesByP={};
  invoices.forEach(inv=>inv.items.forEach(it=>{
    salesByP[it.productId]=salesByP[it.productId]||{qty:0,rev:0};
    salesByP[it.productId].qty+=it.qty;salesByP[it.productId].rev+=it.qty*it.priceUSD;

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

    </div>
    <div class="bg-white border rounded-xl p-4">
      <h3 class="font-bold mb-3">📈 Ventas últimos 7 días</h3>
      <div class="flex items-end gap-1 h-32">
        ${last7.map(x=>`<div class="flex-1 flex flex-col items-center gap-1">
          <div class="text-[10px] text-gray-500 font-mono">$${x.value.toFixed(0)}</div>
          <div class="w-full bg-gradient-to-t from-primary to-amber-300 rounded-t" style="height:${(x.value/maxRev)*100}%;min-height:4px"></div>
          <div class="text-[10px] text-gray-400">${x.label}</div>
        </div>`).join('')}

    </div>
    ${lowStock.length?`<div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2"><span class="text-xl">⚠️</span><h3 class="font-bold text-amber-900">Stock bajo (${lowStock.length})</h3>
      <button data-goto="inventory" class="ml-auto text-xs text-amber-700 underline">Ver todo →</button></div>
      <ul class="space-y-1 text-sm">${lowStock.slice(0,5).map(p=>`<li class="flex justify-between"><span class="truncate">${esc(p.name)}</span><span class="font-mono text-xs ${p.stock===0?'text-red-600 font-bold':'text-amber-700'}">${p.stock===0?'AGOTADO':p.stock+'/'+p.minStock}</span></li>`).join('')}</ul>
    </div>`:''}
    ${topP.length?`<div class="bg-white border rounded-xl p-4">
      <h3 class="font-bold mb-3">🏆 Top 5 productos</h3>
      <ul class="space-y-2">${topP.map((x,i)=>`<li class="flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-amber-100 text-amber-800 text-xs font-bold flex items-center justify-center">${i+1}</span><span class="flex-1 truncate text-sm">${esc(x.p.name)}</span><span class="font-mono text-xs text-gray-500">${x.qty} uds</span><span class="font-mono text-xs text-gray-700 font-bold">${fmtUSD(x.rev)}</span></li>`).join('')}</ul>

  c.innerHTML=`<ul class="space-y-0.5">${cart.map(it=>`<li class="flex items-center gap-1.5 border-b border-gray-100 py-1.5">
    <div class="flex-1 min-w-0"><div class="truncate text-xs font-medium">${esc(it.name)}</div><div class="text-[10px] text-gray-500">${fmtUSD(it.priceUSD)} c/u</div></div>
    <div class="flex items-center gap-0.5">

    </div>
  </li>`).join('')}</ul>`;
  $$('[data-cartInc]').forEach(b=>b.addEventListener('click',()=>{const it=cart.find(x=>x.productId===b.dataset.cartInc);if(it){it.qty++;save();render()}}));
  $$('[data-cartDec]').forEach(b=>b.addEventListener('click',()=>{const it=cart.find(x=>x.productId===b.dataset.cartDec);if(it){it.qty--;if(it.qty<=0)state.cart=cart.filter(x=>x.productId!==it.productId);save();render()}}));
  $$('[data-cartDel]').forEach(b=>b.addEventListener('click',()=>{state.cart=cart.filter(x=>x.productId!==b.dataset.cartDel);save();render()}));
}

function addCart(p){
  if(!state.cart)state.cart=[];
  const e=state.cart.find(x=>x.productId===p.id);
  if(e)e.qty++;
  else state.cart.push({productId:p.id,sku:p.sku,name:p.name,qty:1,priceUSD:p.priceUSD,taxRate:state.taxRate,unit:p.unit});
  save();
}

function computeTotals(cart){
  const sub=cart.reduce((a,i)=>a+i.qty*i.priceUSD,0);
  const tax=cart.reduce((a,i)=>a+i.qty*i.priceUSD*i.taxRate,0);
  return {sub,tax,total:sub+tax};
}

function doCheckout(){
  const cart=state.cart||[];
  if(!cart.length)return;
  for(const it of cart){const p=findP(it.productId);if(!p||p.stock<it.qty){toast(`Sin stock: ${it.name}`,'error');return}}
  openModal(`<form id="checkoutForm" class="p-5 space-y-3">
    <h2 class="text-lg font-bold">Confirmar venta</h2>
    <div class="bg-gray-50 rounded p-3 text-sm space-y-1">
      <div class="flex justify-between"><span>Subtotal</span><span>${fmtUSD(computeTotals(cart).sub)}</span></div>
      <div class="flex justify-between"><span>IVA</span><span>${fmtUSD(computeTotals(cart).tax)}</span></div>
      <div class="flex justify-between font-bold text-base pt-1 border-t"><span>Total</span><span class="text-primary">${fmtUSD(computeTotals(cart).total)}</span></div>
      <div class="flex justify-between text-xs text-gray-500"><span>En Bs</span><span>${fmtVES(computeTotals(cart).total*state.bcvRate)}</span></div>
    </div>
    <div><label class="text-xs text-gray-500">Método de pago</label>
      <select id="coMethod" class="w-full border rounded px-3 py-2 mt-1">
        <option value="CASH_USD">💵 Efectivo USD</option>
        <option value="CASH_VES">💴 Efectivo Bs</option>
        <option value="CARD">💳 Punto de venta</option>
        <option value="TRANSFER">🏦 Transferencia</option>
        <option value="CREDIT">📋 Crédito</option>
      </select></div>
    <div><label class="text-xs text-gray-500">Cliente (opcional)</label>
      <select id="coCustomer" class="w-full border rounded px-3 py-2 mt-1">
        <option value="">— Consumidor final —</option>
        ${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.docId)}</option>`).join('')}
      </select></div>
    <div class="flex gap-2 pt-2">
      <button type="button" data-close class="flex-1 border rounded-lg py-2.5">Cancelar</button>
      <button type="submit" class="flex-1 bg-primary text-white rounded-lg py-2.5 font-bold">Confirmar</button>
    </div>
  </form>`);
  $('#checkoutForm').addEventListener('submit',e=>{
    e.preventDefault();
    const method=$('#coMethod').value;
    const customerId=$('#coCustomer').value||null;
    const totals=computeTotals(cart);
    const number=nextSeq('FAC');
    const issuedAt=new Date().toISOString();
    const customer=customerId?findC(customerId):null;
    const active=state.exchangeRates[state.activeRateType];
    const invoice={id:uid(),number,items:cart.map(x=>({...x})),subtotalUSD:totals.sub,taxUSD:totals.tax,totalUSD:totals.total,totalVES:totals.total*state.bcvRate,bcvRate:state.bcvRate,rateType:state.activeRateType,rateLabel:active?.label,status:method==='CREDIT'?'PENDING_PAYMENT':'ISSUED',paymentMethod:method,customerId,customerSnapshot:customer?{name:customer.name,docId:customer.docId,phone:customer.phone}:null,issuedAt,createdAt:issuedAt,createdBy:state.currentUser.id,payments:[],hashSignature:btoa(number+totals.total+issuedAt).slice(0,32)};
    if(method!=='CREDIT')invoice.payments.push({id:uid(),method,amountUSD:totals.total,amountVES:totals.total*state.bcvRate,bcvRate:state.bcvRate,receivedBy:state.currentUser.id,createdAt:issuedAt});
    else if(customer)customer.balance=(customer.balance||0)+totals.total;
    for(const it of cart)registerMovement(it.productId,'SALE',it.qty,{reference:number,refType:'INVOICE',refId:invoice.id,reason:'Venta POS'});
    addLedger('1101 Caja USD',totals.total,0,'INVOICE',invoice.id,`Factura ${number}`);
    addLedger('4101 Ventas',0,totals.sub,'INVOICE',invoice.id,`Venta ${number}`);
    addLedger('2201 IVA por pagar',0,totals.tax,'INVOICE',invoice.id,`IVA ${number}`);
    state.invoices.unshift(invoice);state.cart=[];
    audit('CREATE','Invoice',invoice.id,{number,total:totals.total});
    save();closeModal();
    toast(`✅ ${number} · ${fmtUSD(totals.total)}`,'success');
    setTimeout(()=>navigate('invoiceDetail',{id:invoice.id}),600);
  });
}

}

function openProductMenu(id){
  const p=findP(id);if(!p)return;
  const user=state.currentUser;
  const canEdit=user.permissions['*']?.includes('*')||user.permissions.inventory?.includes('update');
  openModal(`<div class="p-1">
    <div class="px-4 py-3 border-b"><div class="font-mono text-xs text-gray-500">${esc(p.sku)}${p.barcode?' · '+esc(p.barcode):''}</div><div class="font-bold">${esc(p.name)}</div></div>
    ${canEdit?`<button data-action="edit" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 border-b"><span>✏️</span> Editar producto</button>
    <button data-action="photo" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 border-b"><span>📷</span> ${p.photo?'Cambiar foto':'Agregar foto'}</button>
    <button data-action="adjust" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 border-b"><span>⚖️</span> Ajustar stock</button>`:''}
    <button data-action="kardex" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 border-b"><span>📋</span> Ver kardex (${state.movements.filter(m=>m.productId===p.id).length})</button>
    ${canEdit?`<button data-action="delete" class="w-full text-left px-4 py-3 hover:bg-red-50 flex items-center gap-3 text-red-600 border-b"><span>🗑️</span> Eliminar producto</button>`:''}
    <button data-close class="w-full px-4 py-3 text-gray-500 text-center">Cancelar</button>
  </div>`);
  $$('[data-action]').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.action;closeModal();
    if(a==='edit'||a==='photo')openProductForm(id);

}

        </div>

        <button type="button" id="scanBarcodeBtn" class="bg-gray-900 text-white px-3 rounded" title="Escanear código de barras">📷</button>
      </div>
    </div>
    <div><label class="text-xs text-gray-500">Nombre *</label><input id="pName" value="${esc(p?.name||'')}" required class="w-full border rounded px-2 py-2 mt-0.5"></div>
    <div>
      <label class="text-xs text-gray-500">Departamento</label>
      <select id="pDept" class="w-full border rounded px-2 py-2 mt-0.5">
        <option value="__new__">➕ Nuevo departamento...</option>
        ${state.departments.map(d => `<option value="${d.id}" ${(p?.departmentId || state.departments[0]?.id) === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}
      </select>
      <div id="newDeptWrap" class="hidden mt-2">

      </div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="text-xs text-gray-500">Costo USD *</label><input id="pCost" type="number" step="0.01" min="0" value="${p?.costUSD||''}" required class="w-full border rounded px-2 py-2 mt-0.5"></div>
      <div><label class="text-xs text-gray-500">Precio USD *</label><input id="pPrice" type="number" step="0.01" min="0" value="${p?.priceUSD||''}" required class="w-full border rounded px-2 py-2 mt-0.5"></div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="text-xs text-gray-500">Stock *</label><input id="pStock" type="number" min="0" value="${p?.stock??''}" required class="w-full border rounded px-2 py-2 mt-0.5" ${isEdit?'disabled':''}></div>
      <div><label class="text-xs text-gray-500">Stock mín.</label><input id="pMin" type="number" min="0" value="${p?.minStock??5}" class="w-full border rounded px-2 py-2 mt-0.5"></div>
    </div>
    ${isEdit?'<p class="text-xs text-amber-600">⚠️ El stock se cambia desde "Ajustar stock"</p>':''}
    <div class="flex gap-2 pt-2">
      <button type="button" data-close class="flex-1 border rounded-lg py-2.5">Cancelar</button>
      <button type="submit" class="flex-1 bg-primary text-white rounded-lg py-2.5 font-bold">${isEdit?'Guardar':'Crear'}</button>
    </div>
  </form>`,{w:'max-w-lg'});

  $('#photoInp').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>5*1024*1024){toast('Imagen muy grande (máx 5MB)','error');return}
    const compressed=await compressImage(f,400);
    $('#photoData').value=compressed;
    $('#photoPrev').outerHTML=`<img id="photoPrev" src="${compressed}" class="w-full h-36 object-cover rounded-lg">`;
  });

  $('#scanSkuBtn')?.addEventListener('click',()=>{
    openScannerModal(code=>{
      const input=$('#pSku');
      input.value=code.toUpperCase();
      input.focus();
      toast(`✅ Código: ${code}`,'success');
      const dup=state.products.find(x=>x.sku===code.toUpperCase()&&x.id!==id);
      if(dup)toast(`⚠️ "${code}" ya pertenece a "${dup.name}"`,'warning');
    });
  });

  $('#scanBarcodeBtn')?.addEventListener('click',()=>{
    openScannerModal(code=>{
      $('#pBarcode').value=code.toUpperCase();
      if(!$('#pSku').value){$('#pSku').value=code.toUpperCase();toast(`✅ SKU autocompletado: ${code}`,'success')}
      else toast(`✅ Código de barras: ${code}`,'success');
    });
  });

  // ➕ Listener para nuevo departamento
  $('#pDept')?.addEventListener('change',(e)=>{
    const isNew=e.target.value==='__new__';
    const wrap=$('#newDeptWrap');
    if(wrap)wrap.classList.toggle('hidden',!isNew);
    if(isNew)setTimeout(()=>$('#pNewDept')?.focus(),50);
  });

  $('#productForm').addEventListener('submit',e=>{
    e.preventDefault();
    const sku=$('#pSku').value.trim().toUpperCase();
    const barcode=$('#pBarcode').value.trim()||null;
    if(state.products.find(x=>x.sku===sku&&x.id!==id)){toast(`SKU "${sku}" ya existe`,'error');return}
    if(barcode&&state.products.find(x=>x.barcode===barcode&&x.id!==id)){toast(`Código "${barcode}" ya existe`,'error');return}

    // Resolver departamento
    let departmentId=$('#pDept').value;
    let createdDeptName=null;

    if(departmentId==='__new__'){
      const newName=$('#pNewDept').value.trim();
      const result=createDepartment(newName);
      if(result.error){toast(result.error,'error');$('#pNewDept')?.focus();return}
      if(result.existing){
        departmentId=result.existing.id;
        toast(`ℹ️ "${result.existing.name}" ya existía — usando ese`,'info');
      } else if(result.created){
        departmentId=result.created.id;
        createdDeptName=result.created.name;
      }
    }

    const data={sku,barcode,name:$('#pName').value.trim(),departmentId,costUSD:parseFloat($('#pCost').value),priceUSD:parseFloat($('#pPrice').value),minStock:parseInt($('#pMin').value)||5,unit:$('#pUnit').value,photo:$('#photoData').value||null};
    if(isEdit){Object.assign(p,data);audit('UPDATE','Product',p.id,data);toast('✅ Producto actualizado','success')}
    else{
      const newP={id:uid(),...data,stock:parseInt($('#pStock').value)||0,isActive:true,salesCount:0};
      state.products.push(newP);
      if(newP.stock>0)registerMovement(newP.id,'INITIAL',newP.stock,{reason:'Stock inicial'});
      audit('CREATE','Product',newP.id,data);
      toast(`✅ Producto creado${createdDeptName?` · Depto "${createdDeptName}" agregado`:''}`,'success');
    }
    save();closeModal();render();
  });
}

function openAdjustForm(id){
  const p=findP(id);if(!p)return;
  openModal(`<form id="adjForm" class="p-5 space-y-3">
    <h2 class="text-lg font-bold">Ajustar stock</h2>
    <p class="text-sm text-gray-500">${esc(p.name)} · Stock: <b>${p.stock}</b></p>
    <div class="grid grid-cols-2 gap-2">
      <label class="border rounded-lg p-3 cursor-pointer text-center ring-2 ring-emerald-400"><input type="radio" name="dir" value="IN" checked class="sr-only"><div class="font-bold text-emerald-600">+ Entrada</div></label>
      <label class="border rounded-lg p-3 cursor-pointer text-center"><input type="radio" name="dir" value="OUT" class="sr-only"><div class="font-bold text-red-600">− Salida</div></label>
    </div>
    <div><label class="text-xs text-gray-500">Cantidad</label><input id="adjQty" type="number" min="1" value="1" required class="w-full border rounded px-2 py-2 mt-0.5 text-center text-lg font-mono"></div>
    <div><label class="text-xs text-gray-500">Motivo</label>
      <select id="adjReason" class="w-full border rounded px-2 py-2 mt-0.5"><option value="Conteo físico">Conteo físico</option><option value="Daño">Daño</option><option value="Robo">Robo</option><option value="Vencido">Vencido</option><option value="Otro">Otro</option></select>
    </div>
    <div><label class="text-xs text-gray-500">Detalle</label><input id="adjNotes" class="w-full border rounded px-2 py-2 mt-0.5"></div>
    <div class="flex gap-2 pt-2"><button type="button" data-close class="flex-1 border rounded-lg py-2.5">Cancelar</button><button type="submit" class="flex-1 bg-primary text-white rounded-lg py-2.5 font-bold">Aplicar</button></div>
  </form>`);
  $('#adjForm').addEventListener('submit',e=>{
    e.preventDefault();
    const dir=document.querySelector('[name=dir]:checked').value;
    const qty=parseInt($('#adjQty').value);
    const reason=$('#adjReason').value;
    const notes=$('#adjNotes').value;
    const type=dir==='IN'?'ADJUST_IN':'ADJUST_OUT';
    try{
      registerMovement(id,type,qty,{reason:`${reason}${notes?' · '+notes:''}`,refType:'ADJUSTMENT'});
      audit('ADJUST','Product',id,{type,qty,reason});
      save();closeModal();toast('✅ Ajuste aplicado','success');render();
    }catch(err){toast('❌ '+err.message,'error')}
  });
}

function deleteProduct(id){
  const p=findP(id);if(!p)return;
  if(!confirm(`⚠️ ¿Eliminar "${p.name}"?`))return;
  state.products=state.products.filter(x=>x.id!==id);
  audit('DELETE','Product',id,{sku:p.sku});
  save();closeModal();toast('🗑️ Eliminado','info');render();
}

function viewKardex(id){

  const mvs=state.movements.filter(m=>m.productId===id);

  const entries=mvs.filter(m=>m.signedQuantity>0).reduce((a,m)=>a+m.quantity,0);
  const exits=mvs.filter(m=>m.signedQuantity<0).reduce((a,m)=>a+m.quantity,0);
  const content=`<div class="p-4 max-w-3xl mx-auto space-y-3 fade">
    <div class="bg-white border rounded-xl p-4">
      <div class="flex gap-3">

        <div><div class="text-[10px] text-gray-500 uppercase">Entradas</div><div class="font-bold text-lg text-emerald-600">${entries}</div></div>
        <div><div class="text-[10px] text-gray-500 uppercase">Salidas</div><div class="font-bold text-lg text-red-600">${exits}</div></div>
        <div><div class="text-[10px] text-gray-500 uppercase">Margen</div><div class="font-bold text-lg">${((1-p.costUSD/p.priceUSD)*100).toFixed(0)}%</div></div>

    </div>

      <div class="px-4 py-2.5 bg-gray-50 border-b text-sm font-medium">Movimientos (${mvs.length})</div>
      ${mvs.length===0?'<p class="text-sm text-gray-400 text-center py-8">Sin movimientos</p>':`<div class="divide-y">
        ${mvs.map(m=>{
          const isIn=m.signedQuantity>0;
          const labels={SALE:'Venta',PURCHASE:'Compra',RETURN_IN:'Devolución cliente',RETURN_OUT:'Devolución proveedor',ADJUST_IN:'Ajuste +',ADJUST_OUT:'Ajuste −',INITIAL:'Stock inicial'};
          return `<div class="p-3 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full ${isIn?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'} flex items-center justify-center font-bold shrink-0">${isIn?'+':'−'}</div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium">${labels[m.type]||m.type}</div>
              <div class="text-[10px] text-gray-500 truncate">${esc(m.reference||'')}${m.reason?' · '+esc(m.reason):''}</div>
              <div class="text-[10px] text-gray-400">${fmtDate(m.createdAt)}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="font-mono text-sm font-bold ${isIn?'text-emerald-600':'text-red-600'}">${isIn?'+':'−'}${m.quantity}</div>
              <div class="text-[10px] text-gray-400">saldo: ${m.balanceAfter}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>

  return layout(content,{back:true,title:'Kardex'});

  const renderItems=()=>{
    $('#qItems').innerHTML=cart.map((it,i)=>`<div class="flex justify-between items-center border rounded px-2 py-1.5 text-xs"><span class="flex-1 truncate">${esc(it.name)} × ${it.qty}</span><span class="font-mono">${fmtUSD(it.qty*it.priceUSD)}</span><button type="button" data-qi="${i}" class="ml-2 text-red-500">×</button></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-3">Sin productos</div>';

    audit('CREATE','Quote',number,{number});
    save();closeModal();toast(`✅ ${number}`,'success');render();
  });
  renderItems();updateTotal();
}

function openReturnForm(invoiceId){
  const inv=findInv(invoiceId);if(!inv)return;
  const items=inv.items.map(it=>({...it,returnQty:0}));
  openModal(`<div class="p-5 space-y-3">
    <h2 class="text-lg font-bold">Registrar devolución</h2>
    <p class="text-sm text-gray-500">Factura ${esc(inv.number)} · ${fmtUSD(inv.totalUSD)}</p>
    <div class="max-h-64 overflow-y-auto space-y-1">
      ${items.map((it,i)=>`<div class="flex items-center gap-2 border rounded p-2"><div class="flex-1 min-w-0"><div class="text-xs font-medium truncate">${esc(it.name)}</div><div class="text-[10px] text-gray-500">${it.qty} en factura</div></div><input type="number" min="0" max="${it.qty}" value="0" data-return-idx="${i}" class="w-16 border rounded px-1 py-1 text-center text-sm"></div>`).join('')}
    </div>
    <div><label class="text-xs text-gray-500">Motivo</label><input id="retReason" required placeholder="Ej: Producto defectuoso" class="w-full border rounded px-2 py-2 mt-0.5"></div>
    <div><label class="text-xs text-gray-500">Método</label>
      <select id="retMethod" class="w-full border rounded px-2 py-2 mt-0.5"><option value="CASH">Efectivo</option><option value="CREDIT">Nota de crédito</option></select>
    </div>
    <div class="flex gap-2 pt-2"><button type="button" data-close class="flex-1 border rounded-lg py-2.5">Cancelar</button><button type="button" id="retSave" class="flex-1 bg-orange-500 text-white rounded-lg py-2.5 font-bold">Registrar</button></div>
  </div>`,{w:'max-w-lg'});
  $('#retSave').addEventListener('click',()=>{
    const reason=$('#retReason').value.trim();
    if(!reason){toast('Ingresa motivo','error');return}
    const returnItems=[];
    $$('[data-return-idx]').forEach(inp=>{const qty=parseInt(inp.value)||0;if(qty>0){const idx=+inp.dataset.returnIdx;returnItems.push({...items[idx],qty})}});
    if(!returnItems.length){toast('Selecciona al menos 1 producto','error');return}
    const total=returnItems.reduce((a,i)=>a+i.qty*i.priceUSD*(1+i.taxRate),0);
    const number=nextSeq('DEV');
    for(const it of returnItems)registerMovement(it.productId,'RETURN_IN',it.qty,{reference:number,refType:'RETURN',reason});
    if(inv.customerId){const c=findC(inv.customerId);if(c)c.balance=Math.max(0,(c.balance||0)-total)}
    state.returns.unshift({id:uid(),number,invoiceId,invoiceNumber:inv.number,items:returnItems.map(i=>({productId:i.productId,name:i.name,qty:i.qty,priceUSD:i.priceUSD})),totalUSD:total,reason,refundMethod:$('#retMethod').value,status:'COMPLETED',createdAt:new Date().toISOString(),createdBy:state.currentUser.id});
    addLedger('4101 Ventas',total,0,'RETURN',number,`Devolución ${number}`);
    addLedger('1101 Caja USD',0,total,'RETURN',number,`Reembolso ${number}`);
    audit('CREATE','Return',number,{number,total});
    save();closeModal();toast(`✅ ${number} · ${fmtUSD(total)}`,'success');render();
  });
}

    $('#poItems').innerHTML=items.map((it,i)=>`<div class="flex justify-between items-center border rounded px-2 py-1.5 text-xs"><span class="flex-1 truncate">${esc(it.name)} × ${it.qty} @ ${fmtUSD(it.unitCost)}</span><span class="font-mono mr-2">${fmtUSD(it.qty*it.unitCost)}</span><button type="button" data-poi="${i}" class="text-red-500">×</button></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-3">Sin productos</div>';
    $$('[data-poi]').forEach(b=>b.addEventListener('click',()=>{items.splice(+b.dataset.poi,1);renderItems();updateTotal()}));
  };
  $('#poProd').addEventListener('change',e=>{const p=findP(e.target.value);if(p)$('#poCost').value=p.costUSD});
  $('#poProd').dispatchEvent(new Event('change'));
  $('#poAdd').addEventListener('click',()=>{
    const p=findP($('#poProd').value);const qty=parseInt($('#poQty').value)||0;const cost=parseFloat($('#poCost').value)||0;
    if(!p||!qty||!cost)return;
    items.push({productId:p.id,sku:p.sku,name:p.name,qty,unitCost:cost});
    renderItems();updateTotal();
  });
  $('#poSave').addEventListener('click',()=>{
    if(!items.length){toast('Agrega productos','error');return}
    const number=nextSeq('OC');
    const subtotal=items.reduce((a,i)=>a+i.qty*i.unitCost,0);
    state.purchaseOrders.unshift({id:uid(),number,supplierId:$('#poSupp').value,items:items.map(x=>({...x})),subtotalUSD:subtotal,taxUSD:0,totalUSD:subtotal,status:'DRAFT',createdAt:new Date().toISOString(),createdBy:state.currentUser.id});
    audit('CREATE','PurchaseOrder',number,{number,total:subtotal});
    save();closeModal();toast(`✅ ${number}`,'success');render();
  });
  renderItems();updateTotal();
}

function receivePO(id){
  const po=state.purchaseOrders.find(p=>p.id===id);if(!po)return;
  openModal(`<div class="p-5 space-y-3">
    <h2 class="text-lg font-bold">Recibir mercancía</h2>
    <p class="text-sm text-gray-500">${esc(po.number)} · ${esc(findS(po.supplierId)?.name||'')}</p>
    <div class="max-h-64 overflow-y-auto space-y-1">${po.items.map((it,i)=>`<div class="border rounded p-2"><div class="text-xs font-medium">${esc(it.name)}</div><div class="text-[10px] text-gray-500">Pedido: ${it.qty} @ ${fmtUSD(it.unitCost)}</div><input type="number" min="0" max="${it.qty}" value="${it.qty}" data-recv-idx="${i}" class="w-full border rounded px-2 py-1 mt-1 text-sm"></div>`).join('')}</div>
    <div class="flex gap-2 pt-2"><button type="button" data-close class="flex-1 border rounded-lg py-2.5">Cancelar</button><button type="button" id="recvSave" class="flex-1 bg-emerald-500 text-white rounded-lg py-2.5 font-bold">Recibir</button></div>
  </div>`,{w:'max-w-lg'});
  $('#recvSave').addEventListener('click',()=>{
    const receiptNumber=nextSeq('REC');
    let receivedAny=0;
    $$('[data-recv-idx]').forEach(inp=>{
      const idx=+inp.dataset.recvIdx;const qty=parseInt(inp.value)||0;
      if(qty>0){const it=po.items[idx];registerMovement(it.productId,'PURCHASE',qty,{reference:receiptNumber,refType:'PO',refId:po.id,reason:`Recepción ${po.number}`});const p=findP(it.productId);if(p)p.costUSD=it.unitCost;receivedAny+=qty}
    });
    if(!receivedAny){toast('Ingresa cantidades','error');return}
    po.status='RECEIVED';
    addLedger('1105 Inventario',po.totalUSD,0,'PURCHASE',po.id,`Compra ${po.number}`);
    addLedger('2101 CxP',0,po.totalUSD,'PURCHASE',po.id,`Compra ${po.number}`);
    audit('RECEIVE','PurchaseOrder',po.id,{received:receivedAny});
    save();closeModal();toast('✅ Recepción aplicada','success');render();
  });
}

function viewAnalytics(){
  const salesByP={};
  state.invoices.forEach(inv=>inv.items.forEach(it=>{
    salesByP[it.productId]=salesByP[it.productId]||{qty:0,rev:0};
    salesByP[it.productId].qty+=it.qty;salesByP[it.productId].rev+=it.qty*it.priceUSD;
  }));
  const sorted=Object.entries(salesByP).map(([pid,x])=>({p:findP(pid),...x})).filter(x=>x.p).sort((a,b)=>b.rev-a.rev);
  const totalRev=sorted.reduce((a,x)=>a+x.rev,0);
  let cum=0;
  const withABC=sorted.map(x=>{cum+=x.rev;const pct=totalRev?cum/totalRev*100:0;const abc=pct<=80?'A':pct<=95?'B':'C';return{...x,abc}});
  const abcCounts={A:withABC.filter(x=>x.abc==='A').length,B:withABC.filter(x=>x.abc==='B').length,C:withABC.filter(x=>x.abc==='C').length};
  const deadStock=state.products.filter(p=>!salesByP[p.id]&&p.stock>0);
  const tiedCapital=deadStock.reduce((a,p)=>a+p.stock*p.costUSD,0);
  const restock=state.products.filter(p=>p.stock<=p.minStock).sort((a,b)=>(a.stock-a.minStock)-(b.stock-b.minStock));
  const marginsByDept={};
  state.departments.forEach(d=>{marginsByDept[d.id]={name:d.name,rev:0,cogs:0,color:d.color}});
  state.invoices.forEach(inv=>inv.items.forEach(it=>{
    const p=findP(it.productId);if(!p)return;
    const d=marginsByDept[p.departmentId];
    if(d){d.rev+=it.qty*it.priceUSD;d.cogs+=it.qty*p.costUSD}
  }));
  const byHour=Array(24).fill(0);
  state.invoices.forEach(inv=>{byHour[new Date(inv.createdAt).getHours()]+=inv.totalUSD});
  const maxHour=Math.max(...byHour,1);
  const content=`<div class="p-4 max-w-5xl mx-auto space-y-4 fade">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white border rounded-xl p-3"><div class="text-[10px] text-gray-500 uppercase">Revenue</div><div class="text-xl font-bold text-emerald-600">${fmtUSD(totalRev)}</div></div>
      <div class="bg-white border rounded-xl p-3"><div class="text-[10px] text-gray-500 uppercase">Reposición</div><div class="text-xl font-bold ${restock.length?'text-red-600':''}">${restock.length}</div></div>
      <div class="bg-white border rounded-xl p-3"><div class="text-[10px] text-gray-500 uppercase">Stock muerto</div><div class="text-xl font-bold text-orange-600">${deadStock.length}</div><div class="text-[10px] text-gray-500">${fmtUSD(tiedCapital)}</div></div>
      <div class="bg-white border rounded-xl p-3"><div class="text-[10px] text-gray-500 uppercase">ABC</div><div class="text-xs font-mono">A:${abcCounts.A} B:${abcCounts.B} C:${abcCounts.C}</div></div>
    </div>
    <div class="bg-white border rounded-xl p-4">
      <h3 class="font-bold mb-3">📊 ABC (Pareto)</h3>
      <div class="flex h-6 rounded overflow-hidden">
        <div class="bg-emerald-500 flex items-center justify-center text-white text-xs font-bold" style="width:${totalRev?(withABC.filter(x=>x.abc==='A').reduce((a,x)=>a+x.rev,0)/totalRev*100):0}%">A</div>
        <div class="bg-amber-500 flex items-center justify-center text-white text-xs font-bold" style="width:${totalRev?(withABC.filter(x=>x.abc==='B').reduce((a,x)=>a+x.rev,0)/totalRev*100):0}%">B</div>
        <div class="bg-red-500 flex items-center justify-center text-white text-xs font-bold" style="width:${totalRev?(withABC.filter(x=>x.abc==='C').reduce((a,x)=>a+x.rev,0)/totalRev*100):0}%">C</div>
      </div>
    </div>
    ${restock.length?`<div class="bg-red-50 border border-red-200 rounded-xl p-4">
      <h3 class="font-bold text-red-900 mb-2">🔴 Reposición urgente (${restock.length})</h3>
      <ul class="space-y-1 text-sm">${restock.slice(0,10).map(p=>`<li class="flex justify-between"><span class="truncate">${esc(p.name)}</span><span class="ml-2 font-mono text-xs ${p.stock===0?'text-red-700 font-bold':'text-red-600'}">${p.stock===0?'AGOTADO':p.stock+'/'+p.minStock}</span></li>`).join('')}</ul>
    </div>`:''}
    <div class="bg-white border rounded-xl p-4">
      <h3 class="font-bold mb-3">🕐 Ventas por hora</h3>
      <div class="flex items-end gap-0.5 h-24">${byHour.map(v=>`<div class="flex-1 bg-gradient-to-t from-blue-500 to-blue-300 rounded-t" style="height:${(v/maxHour)*100}%;min-height:2px"></div>`).join('')}</div>
      <div class="flex justify-between text-[9px] text-gray-400 mt-1"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>
    </div>
    <div class="bg-white border rounded-xl p-4">
      <h3 class="font-bold mb-3">💹 Márgenes por depto</h3>
      <div class="space-y-2">${Object.values(marginsByDept).filter(d=>d.rev>0).map(d=>{
        const margin=d.rev-d.cogs;const pct=d.rev?(margin/d.rev*100):0;
        return `<div><div class="flex justify-between text-sm mb-1"><span>${esc(d.name)}</span><span class="font-mono text-xs">${fmtUSD(d.rev)} · ${pct.toFixed(0)}%</span></div><div class="h-2 bg-gray-100 rounded overflow-hidden"><div class="h-full" style="background:${d.color};width:${pct}%"></div></div></div>`;
      }).join('')||'<p class="text-sm text-gray-400 text-center py-3">Sin datos</p>'}</div>
    </div>
    ${deadStock.length?`<div class="bg-orange-50 border border-orange-200 rounded-xl p-4">
      <h3 class="font-bold text-orange-900 mb-2">💀 Stock muerto (${deadStock.length})</h3>
      <p class="text-xs text-orange-700 mb-2">Capital: <b>${fmtUSD(tiedCapital)}</b></p>
      <ul class="space-y-1 text-sm">${deadStock.slice(0,5).map(p=>`<li class="flex justify-between"><span class="truncate">${esc(p.name)}</span><span class="font-mono text-xs">${p.stock} × ${fmtUSD(p.costUSD)}</span></li>`).join('')}</ul>
    </div>`:''}
  </div>`;
  return layout(content,{back:true,title:'Analítica'});
}

    case 'quotes':return viewQuotes();
    case 'returns':return viewReturns();
    case 'purchases':return viewPurchases();
    case 'suppliers':return viewSuppliers();
    case 'employees':return viewEmployees();
    case 'expenses':return viewExpenses();
    case 'analytics':return viewAnalytics();
    case 'settings':return viewSettings();
    case 'notes':return viewNotes();
    default:return state.currentUser?viewHub():viewLogin();
  }
}

function renderDeptChips(sel,onSelect,showNew=false){
  const el=$(sel);if(!el)return;
  el.innerHTML=`
    <button data-dept="" class="px-3 py-1 rounded-full text-xs whitespace-nowrap bg-primary text-white">Todos</button>
    ${state.departments.map(d=>`<button data-dept="${d.id}" class="px-3 py-1 rounded-full text-xs whitespace-nowrap border" style="border-color:${d.color};color:${d.color}">${esc(d.name)}</button>`).join('')}
    ${showNew?`<button data-dept-new="true" class="px-3 py-1 rounded-full text-xs whitespace-nowrap border border-dashed border-gray-400 text-gray-500 hover:bg-gray-50">➕ Nuevo</button>`:''}
  `;
  $$('[data-dept]',el).forEach(b=>b.addEventListener('click',()=>{
    $$('[data-dept]',el).forEach(x=>{x.classList.remove('bg-primary','text-white');x.classList.add('border')});
    b.classList.add('bg-primary','text-white');onSelect(b.dataset.dept);
  }));
  $('[data-dept-new]',el)?.addEventListener('click',()=>openNewDeptFromChips(onSelect,el));
}

      toast(`ℹ️ "${result.existing.name}" ya existe`,'info');

      // Seleccionar el departamento existente
      $$('[data-dept]',chipsEl).forEach(x=>{x.classList.remove('bg-primary','text-white');x.classList.add('border')});

      onSelect(result.existing.id);
      return;
    }
    save();
    closeModal();
    toast(`✅ Departamento "${result.created.name}" creado`,'success');
    // Re-renderizar la vista completa para que aparezca el chip nuevo
    render();

      const el=$('#invDepts');

          btn.classList.add('bg-primary','text-white');
          onSelect(result.created.id);
        }
      }
    },100);
  });
}

        save();toast('✅ Datos importados','success');render();
      }catch(err){toast('❌ Archivo inválido','error')}

    r.readAsText(f);

  $('#resetData')?.addEventListener('click',()=>{

let calcDisplay='0',calcAcc=null,calcOp=null,calcMem=0,calcOpen=false;

function renderFloaters(){
  if(!state.currentUser){$('#floaters').innerHTML='';return}
  $('#floaters').innerHTML=`
    <button id="btnNotes" class="w-12 h-12 rounded-full bg-amber-500 text-white shadow-lg flex items-center justify-center relative">📝
      ${state.notes.filter(n=>!n.done&&n.remindAt&&new Date(n.remindAt)<new Date()).length?`<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">${state.notes.filter(n=>!n.done&&n.remindAt&&new Date(n.remindAt)<new Date()).length}</span>`:''}
    </button>
    <button id="btnCalc" class="w-12 h-12 rounded-full bg-gray-900 text-white shadow-lg flex items-center justify-center">🧮</button>`;
  $('#btnNotes')?.addEventListener('click',()=>navigate('notes'));
  $('#btnCalc')?.addEventListener('click',()=>toggleCalc());
}

function toggleCalc(){
  if(calcOpen){$('#calcPanel')?.remove();calcOpen=false;return}
  calcOpen=true;
  const p=document.createElement('div');
  p.id='calcPanel';
  p.className='fixed bottom-20 right-4 w-72 bg-white rounded-2xl shadow-2xl border z-50 overflow-hidden modal-in';
  p.innerHTML=`<div class="flex items-center justify-between bg-gray-900 text-white px-3 py-2"><span class="text-xs font-bold">Calculadora</span><button id="calcClose" class="p-1 hover:bg-white/10 rounded text-xs">✕</button></div>
    <div class="p-3 space-y-2">
      <div class="bg-gray-100 rounded p-3"><div class="text-[10px] text-gray-500 h-3" id="calcAcc"></div><div class="text-right text-2xl font-mono font-bold truncate" id="calcDisp">${calcDisplay}</div>${calcMem!==0?`<div class="text-[10px] text-blue-600 text-right">M=${calcMem}</div>`:''}</div>
      <div class="text-[10px] text-gray-500 text-center">${state.exchangeRates[state.activeRateType]?.symbol||'USD'}: ${state.bcvRate.toFixed(2)}</div>
      <div class="grid grid-cols-4 gap-1" id="calcGrid"></div>
    </div>`;
  document.body.appendChild(p);
  $('#calcClose')?.addEventListener('click',()=>{p.remove();calcOpen=false});
  const keys=[['MC','M+','M-','MR'],['C','±','√','÷'],['7','8','9','×'],['4','5','6','-'],['1','2','3','+'],['0','.','BCV','=']];
  $('#calcGrid').innerHTML=keys.flat().map(k=>`<button data-calc="${k}" class="py-2.5 rounded-lg font-bold text-sm ${['÷','×','-','+','='].includes(k)?'bg-primary text-white':['MC','M+','M-','MR','C','±','√','BCV'].includes(k)?'bg-gray-200':'bg-gray-50 hover:bg-gray-100'}">${k}</button>`).join('');
  $$('[data-calc]').forEach(b=>b.addEventListener('click',()=>{
    calcPress(b.dataset.calc);
    $('#calcDisp').textContent=calcDisplay;
    $('#calcAcc').textContent=(calcAcc!==null&&calcOp)?calcAcc+' '+calcOp:'';
  }));
}

function calcPress(k){
  if(/^\d$/.test(k)){calcDisplay=calcDisplay==='0'?k:calcDisplay+k;return}
  if(k==='.'){if(!calcDisplay.includes('.'))calcDisplay+='.';return}
  if(['+','-','×','÷'].includes(k)){
    if(calcAcc!==null&&calcOp)calcPress('=');
    calcAcc=parseFloat(calcDisplay);calcOp=k;calcDisplay='0';return;
  }
  if(k==='='){
    if(calcAcc===null||!calcOp)return;
    const b=parseFloat(calcDisplay);let r=0;
    switch(calcOp){case '+':r=calcAcc+b;break;case '-':r=calcAcc-b;break;case '×':r=calcAcc*b;break;case '÷':r=b!==0?calcAcc/b:NaN;break}
    calcDisplay=String(+r.toFixed(6));calcAcc=null;calcOp=null;return;
  }
  if(k==='C'){calcDisplay='0';calcAcc=null;calcOp=null;return}
  if(k==='±'){calcDisplay=String(-parseFloat(calcDisplay));return}
  if(k==='√'){calcDisplay=String(Math.sqrt(parseFloat(calcDisplay)));return}
  if(k==='M+'){calcMem+=parseFloat(calcDisplay);return}
  if(k==='M-'){calcMem-=parseFloat(calcDisplay);return}
  if(k==='MR'){calcDisplay=String(calcMem);return}
  if(k==='MC'){calcMem=0;return}
  if(k==='BCV'){calcDisplay=String(+(parseFloat(calcDisplay)*state.bcvRate).toFixed(2));return}
}

setInterval(()=>{
  if(!state.currentUser)return;
  const now=new Date();
  state.notes.filter(n=>!n.done&&n.remindAt&&new Date(n.remindAt)<=now&&!n.notified).forEach(n=>{
    n.notified=true;
    toast(`⏰ ${n.title}`,'warning');
    if(Notification.permission==='granted')new Notification(`⏰ ${n.title}`,{body:n.content||'Recordatorio'});
  });
  save();
},60_000);

if('Notification' in window&&Notification.permission==='default'){
  setTimeout(()=>Notification.requestPermission(),5000);
}
